[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ollama-code-agent"
version = "22.0.0"
description = "Local-first terminal coding agent powered by Ollama"
requires-python = ">=3.10"
dependencies = ["rich>=13.7,<15", "textual>=0.80"]
license = "MIT"
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
ollama-code = "ollama_code.app:main"
ollama-code-doctor = "ollama_code.doctor:main"
ollama-code-benchmark = "ollama_code.benchmark:main"
[tool.setuptools.packages.find]
include = ["ollama_code*"]
